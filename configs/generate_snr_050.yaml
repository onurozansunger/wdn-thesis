# Modena, full five-family threat model (replay included) plus clean
# windows. Supersedes generate_workshop_modena.yaml, which dropped replay.
network_inp: data/modena.inp
duration_hours: 24
hydraulic_timestep_minutes: 60
num_scenarios: 50
demand_variation: 0.3
demand_pattern_amplitude: 0.5
corruption:
  missing_rate_pressure: 0.5
  missing_rate_flow: 0.5
  noise_sigma_pressure: 0.5
  noise_sigma_flow: 0.2
  attack_enabled: true
  attack_fraction: 0.15
  attack_bias: 3.0
  attack_scale: 1.5
  attack_type: mixed
  attack_pool: [clean, random, replay, stealthy, noise, targeted]
output_dir: data/snr_modena_050
seed: 99
