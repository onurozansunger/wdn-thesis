# "Hard but possible" regime: the diurnal cycle gives the signal real
# temporal content, and attack magnitudes sit near the noise floor rather
# than tens of sigma above it. This is the regime in which architectural
# choices can actually be discriminated.
network_inp: data/modena.inp
duration_hours: 24
hydraulic_timestep_minutes: 60
num_scenarios: 50
demand_variation: 0.3
demand_pattern_amplitude: 0.0
corruption:
  missing_rate_pressure: 0.5
  missing_rate_flow: 0.5
  noise_sigma_pressure: 0.5
  noise_sigma_flow: 0.2
  attack_enabled: true
  attack_fraction: 0.15
  attack_bias: 0.35
  attack_scale: 1.01
  attack_type: mixed
  attack_pool: [clean, random, replay, stealthy, noise, targeted]
output_dir: data/staticsmall_modena
seed: 99
