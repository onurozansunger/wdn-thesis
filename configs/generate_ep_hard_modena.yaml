# Near-threshold regime with persistent attack episodes.
#
# The generator previously redrew the attack family, the compromised
# sensors and the mask at every snapshot, so a six-step window spanned
# four or five unrelated attacks and no attack persisted on any sensor
# (measured: 0% of windows held a single family, consecutive snapshots
# shared 8% of their attacked sensors). A 'slow drift' therefore never
# drifted anywhere, and the temporal components had nothing to learn.
#
# Episodes of 8-14 snapshots against a window of 6 mean most windows
# sit inside one episode. Uses the recorded attacker throughout.
network_inp: data/modena.inp
duration_hours: 24
hydraulic_timestep_minutes: 60
num_scenarios: 50
demand_variation: 0.3
demand_pattern_amplitude: 0.25
corruption:
  missing_rate_pressure: 0.5
  missing_rate_flow: 0.5
  noise_sigma_pressure: 0.5
  noise_sigma_flow: 0.2
  attack_enabled: true
  attack_fraction: 0.15
  attack_bias: 0.35
  attack_scale: 1.01
  attack_type: mixed
  attack_pool:
  - clean
  - random
  - replay
  - stealthy
  - noise
  - targeted
  attack_episode_min: 8
  attack_episode_max: 14
  replay_records_observation: true
output_dir: data/ep_hard_modena
seed: 99
