# L-Town (BattLeDIM 2020): 782 junctions, 905 pipes — 2.9x Modena.
# Identical corruption pipeline and threat model, so the only difference
# between the two domains is the topology and its hydraulics.
network_inp: data/L-Town.inp
duration_hours: 24
hydraulic_timestep_minutes: 60
num_scenarios: 50
demand_variation: 0.3
corruption:
  missing_rate_pressure: 0.5
  missing_rate_flow: 0.5
  noise_sigma_pressure: 0.5
  noise_sigma_flow: 0.2
  attack_enabled: true
  attack_fraction: 0.15
  attack_bias: 3.0
  attack_scale: 1.5
  attack_type: mixed
  attack_pool: [clean, random, replay, stealthy, noise, targeted]
output_dir: data/v2_ltown
seed: 99
